apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytix
  labels:
    app.kubernetes.io/name: analytix
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytix
    spec:
      # Do not set runAsUser/runAsGroup: OpenShift restricted SCC assigns a
      # namespace UID range; a fixed 65534 often fails admission.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytix
          image: analytix:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: ANALYTX_HOST
              value: "0.0.0.0"
            - name: ANALYTX_PORT
              value: "8765"
            # Multipart spool + libraries that touch HOME/XDG under read-only root
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp
            - name: LANG
              value: C.UTF-8
            - name: LC_ALL
              value: C.UTF-8
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
